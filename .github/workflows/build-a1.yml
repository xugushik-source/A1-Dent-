name: Build A1 clinic site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy GALADENT template
        run: |
          git clone --depth 1 https://github.com/xugushik-source/galadent-plus.git /tmp/template
          cp /tmp/template/index.html /tmp/template/about.html /tmp/template/tips.html /tmp/template/staff.html /tmp/template/Code.gs .
      - name: Adapt template to A1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files=['index.html','about.html','tips.html','staff.html','Code.gs']
          reps={
            'GALADENT+':'A1',
            'გალადენტ+':'A1',
            '+995514593000':'+995322800101',
            '+995 514 59 30 00':'+995 32 280 01 01',
            '995514593000':'995322800101',
            'Тбилиси, Глдани':'Тбилиси, Ваке',
            'თბილისი, გლდანი':'თბილისი, ვაკე',
            'Gldani, Tbilisi':'Vake, Tbilisi',
            'გლდანში, თბილისში':'ვაკეში, თბილისში',
            'в Глдани, Тбилиси':'в Ваке, Тбилиси',
            'V მიკრორაიონი, კორპ. 26ბ, გლდანი, თბილისი':'ზაქარია ფალიაშვილის ქ. 15, თბილისი',
            'V microdistrict, building 26B, Vake, Tbilisi':'15 Zakaria Paliashvili St, Tbilisi',
            'V микрорайон, корпус 26Б, Ваке, Тбилиси':'ул. Закария Палиашвили, 15, Тбилиси',
            '41.8024154%2C44.8302084':'41.708258%2C44.774648',
            'ChIJC4z2wyBB5awRl4ORSDbskQk':'',
          }

          for fn in files:
            p=Path(fn)
            s=p.read_text(encoding='utf-8')
            for a,b in reps.items():
              s=s.replace(a,b)

            # Never keep repository-specific absolute internal links.
            s=re.sub(r'href="/(?:A1-Dent-/)?(index|about|tips|staff)\.html', r'href="\1.html', s)
            s=re.sub(r'href="https://xugushik-source\.github\.io/[^/]+/(index|about|tips|staff)\.html', r'href="\1.html', s)

            # Replace any embedded template logo with the local A1 logo.
            s=re.sub(r'<img[^>]*src="data:image/[^>]+>', '<img src="a1-logo.svg" alt="A1">', s)

            # Ensure the A1 logo is present in every public page header.
            if fn in ['index.html','about.html','tips.html'] and 'a1-logo.svg' not in s:
              s=s.replace('<div class="clinic-group">', '<div class="clinic-group">\n    <img src="a1-logo.svg" alt="A1">', 1)

            # Client photos are not committed yet: remove broken image blocks instead
            # of showing missing images or photos inherited from another clinic.
            if fn in ['about.html','tips.html']:
              s=re.sub(r'<div class="photo-grid">.*?</div>\s*</div>\s*</div>', '', s, count=1, flags=re.S)
              s=re.sub(r'<div class="photo">\s*<img[^>]+>\s*</div>', '', s, flags=re.S)
              s=re.sub(r'<img[^>]+src="photos/[^>]+>', '', s)

            p.write_text(s,encoding='utf-8')

          # Clinic-specific factual copy, without changing template structure.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Здоровые зубы — <em>без очередей и звонков</em>','A1 — <em>современная стоматология в центре Тбилиси</em>')
          s=s.replace('ჯანმრთელი კბილები — <em>რიგებისა და ზარების გარეშე</em>','A1 — <em>თანამედროვე სტომატოლოგია თბილისის ცენტრში</em>')
          s=s.replace('Healthy teeth — <em>without queues or phone calls</em>','A1 — <em>modern dentistry in central Tbilisi</em>')
          s=s.replace('A1 · Тбилиси, Ваке','A1 · Тбилиси, ул. Закария Палиашвили 15')
          p.write_text(s,encoding='utf-8')

          # Use a local asset, so the clone works under any GitHub Pages repo path.
          Path('a1-logo.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A1"><circle cx="100" cy="100" r="88" fill="none" stroke="#C9974A" stroke-width="6"/><text x="38" y="139" font-family="Georgia,serif" font-size="118" font-style="italic" fill="#C9974A">A</text><text x="116" y="88" font-family="Georgia,serif" font-size="62" font-weight="700" fill="#C9974A">1</text></svg>''', encoding='utf-8')
          PY
      - name: Validate clone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          bad=[]
          for fn in ['index.html','about.html','tips.html','staff.html']:
            s=Path(fn).read_text(encoding='utf-8')
            if 'data-i18n="hy"' in s: bad.append(f'{fn}: Armenian i18n remains')
            if re.search(r'href="/(?:index|about|tips|staff)\.html', s): bad.append(f'{fn}: root-relative internal link')
            for src in re.findall(r'(?:src|href)="([^"#?]+)"', s):
              if src.startswith(('http://','https://','tel:','mailto:','javascript:')): continue
              if src.endswith(('.html','.svg','.jpg','.jpeg','.png','.webp')) and not Path(src).exists():
                bad.append(f'{fn}: missing local target {src}')
          if bad:
            print('\n'.join(bad)); sys.exit(1)
          print('A1 clone validation passed')
          PY
      - name: Commit generated site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html about.html tips.html staff.html Code.gs a1-logo.svg
          git commit -m "Fix A1 paths navigation logo and clinic details" || exit 0
          git push